name: Quantitative Credit & CDS Desk CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typescript-and-build:
    name: TypeScript Lint, Vitest & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  python-pytest-and-quantlib:
    name: Python 3.11 Pytest & QuantLib Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest -v
      - run: python scripts/benchmark_quantlib.py
